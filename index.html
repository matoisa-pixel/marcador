<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LA ZONA POINT FIGHTING</title>
<style>
  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    margin: 0; 
    padding: 0; 
  }

  html, body { 
    touch-action: manipulation; 
    overscroll-behavior: none; 
    width: 100vw;
    height: 100vh; 
    height: 100svh;
    overflow: hidden; 
    background: #111; 
    color: #fff; 
    font-family: Arial, sans-serif; 
    text-align: center; 
    user-select: none; 
    -webkit-user-select: none; 
  }

  /* TÍTULO COMPACTO Y ELEGANTE */
  .evento { 
    height: 8vh;
    height: 8svh;
    font-size: 5vh; 
    background: #000; 
    font-weight: 900; 
    letter-spacing: 2px; 
    border-bottom: 4px solid #ffc107; 
    text-transform: uppercase; 
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .evento sup { 
    font-size: 1.8vh; 
    color: #ffc107; 
    margin-left: 4px; 
    vertical-align: super; 
  }

  /* CONTENEDOR CON MARGEN DESPEJADO */
  .container { 
    display: flex; 
    width: 100vw; 
    height: 92vh; 
    height: 92svh;
  }

  .jugador { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    position: relative; 
    padding: 1.5vh 1vw 2vh 1vw; 
  }

  #rojo { background: #c62828; }
  #azul { background: #1565c0; }

  .nombre { 
    font-size: 3vh; 
    font-weight: 900; 
    text-shadow: 0 0 8px rgba(0,0,0,0.8); 
  }

  .puntos { 
    font-size: 16vh; 
    font-weight: 900; 
    line-height: 0.85; 
    text-shadow: 0 0 20px rgba(0,0,0,0.7); 
    -webkit-text-stroke: 2px #000; 
    margin: 0.5vh 0; 
    flex: 1; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }

  .botones-puntos {
    display: flex;
    justify-content: center;
    gap: 0.8vw;
    margin-bottom: 1.2vh;
  }

  .botones-puntos button { 
    font-size: 2vh; 
    padding: 0.8vh 1.2vw; 
    border: 2px solid #000; 
    border-radius: 10px; 
    cursor: pointer; 
    font-weight: 900; 
  }

  .btn-suma { background: #fff; color: #000; }
  .btn-suma:active { background: #e0e0e0; transform: scale(0.95); }
